name: Build RPM Package

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  package-rpm:
    runs-on: ubuntu-latest
    container:
      image: fedora:42

    steps:
      - name: Install build tools
        run: |
          dnf install -y \
            git \
            rpm-build \
            rpmdevtools \
            cargo \
            cmake \
            gcc-c++ \
            libavcodec-free-devel \
            libavformat-free-devel \
            libavutil-free-devel \
            libcurl-devel \
            libdrm-devel \
            libswresample-free-devel \
            libswscale-free-devel \
            boost-devel \
            fftw-devel \
            ninja-build \
            pkgconfig \
            readline-devel \
            rust \
            libuuid-devel

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - name: Configure git safe directory
        run: git config --global --add safe.directory $(pwd)

      - name: Get version from git describe
        id: get_version
        run: |
          VERSION=$(git describe --tags --always | sed 's/^v//')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Get short SHA
        id: short_sha
        run: echo "sha=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Set up RPM build tree
        run: rpmdev-setuptree

      - name: Create source tarball
        run: |
          VERSION=${{ steps.get_version.outputs.version }}
          git archive --prefix=fastflowlm-${VERSION}/ HEAD \
            | gzip > ~/rpmbuild/SOURCES/fastflowlm-${VERSION}.tar.gz

      - name: Build RPM
        run: |
          VERSION=${{ steps.get_version.outputs.version }}
          rpmbuild -bb packaging/rpm/fastflowlm.spec \
            --define "flm_version ${VERSION}" \
            --define "_smp_build_ncpus $(nproc)"

      - name: Collect RPM artifact
        run: |
          VERSION=${{ steps.get_version.outputs.version }}
          find ~/rpmbuild/RPMS -name "*.rpm" -exec cp {} . \;
          ls -lah fastflowlm*.rpm

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: flm-fedora42-${{ steps.short_sha.outputs.sha }}-rpm
          path: fastflowlm*.rpm
          if-no-files-found: error

  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: package-rpm
    if: github.ref_type == 'tag'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from git describe
        id: get_version
        run: |
          VERSION=$(git describe --tags --always)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Download all RPM artifacts
        uses: actions/download-artifact@v4
        with:
          path: rpms
          pattern: '*-rpm'

      - name: Upload RPMs to Release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref }}
          file_glob: true
          file: rpms/*/*.rpm
